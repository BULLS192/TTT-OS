name: TTT OS Browser E2E

on:
  pull_request:
    branches: [main]
  deployment_status:

jobs:
  public-smoke:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TTT_E2E_BASE_URL: https://ttt-os.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public browser smoke
        run: npx playwright test tests/e2e/public-smoke.spec.cjs
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-public-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  authenticated-lifecycle:
    if: >
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTT_E2E_BASE_URL: https://ttt-os.vercel.app
      TTT_E2E_EMAIL: ${{ secrets.TTT_E2E_EMAIL }}
      TTT_E2E_PASSWORD: ${{ secrets.TTT_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated lifecycle
        run: npx playwright test tests/e2e/authenticated-core-lifecycle.spec.cjs
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-authenticated-lifecycle
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
