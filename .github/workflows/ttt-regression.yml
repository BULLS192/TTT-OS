name: TTT OS Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pre-deploy bootstrap gate
        run: node tests/predeploy-gate-v01.cjs
      - name: Customer intake regression
        run: node tests/customer-intake-v01.cjs
      - name: Scheduling regression
        run: node tests/scheduling-v09.cjs
      - name: Production-readiness regression
        run: node tests/production-readiness-v01.cjs
      - name: Operational numbering regression
        run: node tests/operational-numbering-v01.cjs
      - name: Deployment discipline regression
        run: node tests/deployment-discipline-v01.cjs
      - name: Architecture and catalog regression
        run: node tests/regression-architecture-catalog-v01.cjs
